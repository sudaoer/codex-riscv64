name: Publish validated candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Candidate build run ID
        required: true
        type: string
      k3_report_b64:
        description: Base64-encoded validation report (stored as k3-report.json)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      release_tag: ${{ steps.preflight.outputs.release_tag }}
      candidate_head_sha: ${{ steps.preflight.outputs.candidate_head_sha }}
      validation_target: ${{ steps.preflight.outputs.validation_target }}
    steps:
      - name: Check out release policy from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download candidate from the selected run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-riscv64-candidate
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Decode K3 evidence
        env:
          K3_REPORT_B64: ${{ inputs.k3_report_b64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path("k3-report.json").write_bytes(
              base64.b64decode(os.environ["K3_REPORT_B64"], validate=True)
          )
          PY

      - name: Verify selected GitHub run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > run.json
          python3 scripts/release.py \
            --release-lock candidate/release-lock.json \
            validate-run \
            --run-json run.json \
            --candidate-dir candidate \
            --run-id "$RUN_ID" >/dev/null

      - name: Verify candidate bytes and validation report
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py \
            --release-lock candidate/release-lock.json \
            verify-latest >/dev/null
          python3 scripts/release.py \
            --release-lock candidate/release-lock.json \
            preflight \
            --candidate-dir candidate \
            --k3-report k3-report.json \
            --run-id "${{ inputs.candidate_run_id }}" >/dev/null

      - name: Stage exact promotion payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-promotion-${{ inputs.candidate_run_id }}
          path: |
            candidate/*
            k3-report.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out release policy from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download approved promotion payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-promotion-${{ inputs.candidate_run_id }}
          path: promotion

      - name: Reverify exact bytes after approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py \
            --release-lock promotion/candidate/release-lock.json \
            verify-latest >/dev/null
          python3 scripts/release.py \
            --release-lock promotion/candidate/release-lock.json \
            preflight \
            --candidate-dir promotion/candidate \
            --k3-report promotion/k3-report.json \
            --run-id "${{ inputs.candidate_run_id }}" >/dev/null

      - name: Create draft, verify assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.candidate_head_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists and will not be overwritten: $RELEASE_TAG" >&2
            exit 1
          fi
          VALIDATION_TARGET=$(python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("promotion/k3-report.json").read_text())
          print(report.get("validation_target", "native-k3"))
          PY
          )
          cat > release-notes.md <<EOF
          Unofficial Codex build for Linux/riscv64.

          This release promotes the exact candidate bytes from Actions run
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.candidate_run_id }}
          after ${VALIDATION_TARGET} validation and protected-environment approval.
          EOF
          gh release create "$RELEASE_TAG" \
            promotion/candidate/* \
            promotion/k3-report.json \
            --draft \
            --latest=false \
            --target "$CANDIDATE_HEAD_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --json assets > remote-release.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {path.name for path in Path("promotion/candidate").iterdir() if path.is_file()}
          expected.add("k3-report.json")
          release = json.loads(Path("remote-release.json").read_text())
          actual = {asset["name"] for asset in release["assets"]}
          if actual != expected:
              raise SystemExit(
                  f"release asset mismatch; missing={sorted(expected - actual)}, "
                  f"unexpected={sorted(actual - expected)}"
              )
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
