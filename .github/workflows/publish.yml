name: Publish validated candidate
run-name: ${{ inputs.task_id && format('upstream:{0}', inputs.task_id) || 'Publish validated candidate' }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Upstream watcher task identity
        required: false
        type: string
      candidate_run_id:
        description: Successful Candidate build run ID
        required: true
        type: string
      validation_run_id:
        description: Successful QEMU validation run ID (required for automated publication)
        required: false
        type: string
      validation_run_attempt:
        description: Exact attempt of the QEMU validation run
        required: false
        type: string
      k3_report_b64:
        description: Maintainer-only local report; mutually exclusive with the QEMU run inputs
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      attestations: read
    outputs:
      candidate_head_sha: ${{ steps.preflight.outputs.candidate_head_sha }}
      promotion_artifact: ${{ steps.payload.outputs.name }}
    steps:
      - name: Check out release policy from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Authenticate and retrieve validation evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          VALIDATION_RUN_ATTEMPT: ${{ inputs.validation_run_attempt }}
          K3_REPORT_B64: ${{ inputs.k3_report_b64 }}
        run: |
          python3 scripts/workflow_handoff.py prepare-report \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --validation-run-id "$VALIDATION_RUN_ID" \
            --validation-run-attempt "$VALIDATION_RUN_ATTEMPT" \
            --report-b64 "$K3_REPORT_B64" \
            --output k3-report.json

      - name: Wait for the selected Candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          python3 scripts/workflow_handoff.py wait-candidate \
            --run-id "$RUN_ID" --output run.json

      - name: Download candidate from the selected run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-riscv64-candidate
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Resolve locked candidate source revision
        id: source
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          candidate = json.loads(Path("candidate/candidate.json").read_text())
          source_sha = candidate.get("candidate_head_sha")
          if not isinstance(source_sha, str) or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("invalid locked candidate source SHA")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"sha={source_sha}\n")
          PY

      - name: Check out locked candidate release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: locked-source
          persist-credentials: false

      - name: Verify selected GitHub run
        env:
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          python3 scripts/release.py \
            --policy locked-source/release/policy.toml \
            --release-lock candidate/release-lock.json \
            validate-run \
            --run-json run.json \
            --candidate-dir candidate \
            --run-id "$RUN_ID" >/dev/null

      - name: Verify Candidate build attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify \
            candidate/codex-package-riscv64gc-unknown-linux-musl.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --source-ref refs/heads/main \
            --source-digest "$(python3 -c 'import json; print(json.load(open("run.json"))["head_sha"])')" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/candidate-build.yml"

      - name: Verify candidate bytes and validation report
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py \
            --policy locked-source/release/policy.toml \
            --release-lock candidate/release-lock.json \
            preflight \
            --candidate-dir candidate \
            --k3-report k3-report.json \
            --run-id "${{ inputs.candidate_run_id }}" >/dev/null

      - name: Name exact promotion payload
        id: payload
        run: echo "name=verified-promotion-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Stage exact promotion payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.payload.outputs.name }}
          path: |
            candidate/*
            k3-report.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out release policy from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download verified promotion payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.preflight.outputs.promotion_artifact }}
          path: promotion

      - name: Check out locked candidate release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_head_sha }}
          path: locked-source
          persist-credentials: false

      - name: 复核候选包并发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          python3 scripts/publish_release.py \
            --policy locked-source/release/policy.toml \
            --release-lock promotion/candidate/release-lock.json \
            --candidate-dir promotion/candidate \
            --k3-report promotion/k3-report.json \
            --run-id "$CANDIDATE_RUN_ID"
