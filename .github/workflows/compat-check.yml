name: Compatibility check

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'analysis/**'
  workflow_dispatch:
    inputs:
      continue_chain:
        description: Internal flag used by the upstream watcher to continue the build chain
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out downstream inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate downstream release tooling
        id: policy
        run: |
          python3 scripts/release.py validate-policy
          python3 -m unittest discover -s tests -v

      - name: Resolve latest stable release lock
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py resolve-latest \
            --output "${RUNNER_TEMP}/release-lock.json"
          python3 scripts/release.py \
            --release-lock "${RUNNER_TEMP}/release-lock.json" \
            validate

      - name: Reconstruct exact patched source
        run: |
          python3 scripts/release.py \
            --release-lock "${RUNNER_TEMP}/release-lock.json" \
            prepare \
            --source-dir "${RUNNER_TEMP}/source" \
            --report "${RUNNER_TEMP}/source-info.json"

      - name: Run focused upstream package and V8 tests
        env:
          CODEX_REPO_ROOT: ${{ runner.temp }}/source
        working-directory: ${{ runner.temp }}/source
        run: |
          python3 .github/scripts/test_rusty_v8_bazel.py
          python3 -m unittest \
            scripts.codex_package.test_archive \
            scripts.codex_package.test_cargo \
            scripts.codex_package.test_layout \
            scripts.codex_package.test_targets \
            scripts.codex_package.test_zsh \
            -v

      - name: Set up exact upstream Rust
        env:
          RUST_VERSION: ${{ steps.release.outputs.rust }}
          TARGET: ${{ steps.policy.outputs.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"

      - name: Check Cargo workspace metadata
        working-directory: ${{ runner.temp }}/source/codex-rs
        run: |
          cargo metadata \
            --locked \
            --format-version 1 \
            --filter-platform "${{ steps.policy.outputs.target }}" \
            >/dev/null

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1
          bazelisk-cache: true
          repository-cache: true
          module-root: ${{ runner.temp }}/source

      - name: Check the RISC-V V8 release target
        working-directory: ${{ runner.temp }}/source
        run: |
          bazel query \
            //third_party/v8:rusty_v8_sandbox_release_pair_riscv64gc_unknown_linux_musl

      - name: Upload immutable release lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-riscv64-release-lock
          path: ${{ runner.temp }}/release-lock.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  continue-chain:
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.continue_chain == true &&
      github.actor == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Trigger V8 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run v8-build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f compatibility_run_id="$GITHUB_RUN_ID" \
            -f compatibility_source_sha="$GITHUB_SHA" \
            -f continue_chain=true
