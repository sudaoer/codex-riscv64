name: Compatibility check
run-name: ${{ inputs.task_id && format('upstream:{0}', inputs.task_id) || 'Compatibility check' }}

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'analysis/**'
  workflow_dispatch:
    inputs:
      task_id:
        description: Upstream watcher task identity
        required: false
        type: string
      release_lock_b64:
        description: Base64-encoded immutable release lock
        required: false
        type: string
      downstream_source_sha:
        description: Exact downstream source revision for the release task
        required: false
        type: string
      continue_chain:
        description: Internal flag used by the upstream watcher to continue the build chain
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: compat-${{ inputs.task_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.task_id == '' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out downstream inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate downstream release tooling
        id: policy
        run: |
          python3 scripts/release.py validate-policy
          python3 -m unittest discover -s tests -v

      - name: Validate upstream release metadata access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, "scripts")
          from upstream_watch import GitHub

          client = GitHub(os.environ["GITHUB_TOKEN"], os.environ["GITHUB_REPOSITORY"])
          releases = client.releases("openai/codex")
          print(f"Read {len(releases)} upstream release metadata records with the Actions token")
          PY

      - name: Resolve stable release lock
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK_ID: ${{ inputs.task_id }}
          RELEASE_LOCK_B64: ${{ inputs.release_lock_b64 }}
          DOWNSTREAM_SOURCE_SHA: ${{ inputs.downstream_source_sha }}
          CONTINUE_CHAIN: ${{ inputs.continue_chain }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          task_id = os.environ["TASK_ID"]
          lock_b64 = os.environ["RELEASE_LOCK_B64"]
          source_sha = os.environ["DOWNSTREAM_SOURCE_SHA"]
          if task_id:
              if re.fullmatch(r"[0-9a-f]{64}", task_id) is None:
                  raise SystemExit("invalid upstream task identity")
              if not lock_b64 or not source_sha:
                  raise SystemExit("upstream tasks require a release lock and source SHA")
              if (os.environ["CONTINUE_CHAIN"] != "true"
                      or os.environ["GITHUB_ACTOR"] != "github-actions[bot]"):
                  raise SystemExit("upstream tasks must continue the bot-dispatched chain")
          if source_sha and source_sha != os.environ["GITHUB_SHA"]:
              raise SystemExit("downstream source SHA does not match the dispatched revision")
          if lock_b64:
              lock_bytes = base64.b64decode(lock_b64, validate=True)
              if task_id:
                  task_inputs = json.dumps(
                      {"release_lock": json.loads(lock_bytes), "source_sha": source_sha},
                      sort_keys=True, separators=(",", ":"),
                  ).encode()
                  if hashlib.sha256(task_inputs).hexdigest() != task_id:
                      raise SystemExit("upstream task identity does not match release inputs")
              Path(os.environ["RUNNER_TEMP"], "release-lock.json").write_bytes(lock_bytes)
          PY
          if [[ -z "$RELEASE_LOCK_B64" ]]; then
            python3 scripts/release.py resolve-latest \
              --output "${RUNNER_TEMP}/release-lock.json"
          fi
          python3 scripts/release.py \
            --release-lock "${RUNNER_TEMP}/release-lock.json" \
            validate

      - name: Reconstruct exact patched source
        run: |
          python3 scripts/release.py \
            --release-lock "${RUNNER_TEMP}/release-lock.json" \
            prepare \
            --source-dir "${RUNNER_TEMP}/source" \
            --report "${RUNNER_TEMP}/source-info.json"

      - name: Run focused upstream package and V8 tests
        env:
          CODEX_REPO_ROOT: ${{ runner.temp }}/source
        working-directory: ${{ runner.temp }}/source
        run: |
          python3 .github/scripts/test_rusty_v8_bazel.py
          python3 -m unittest \
            scripts.codex_package.test_archive \
            scripts.codex_package.test_cargo \
            scripts.codex_package.test_layout \
            scripts.codex_package.test_targets \
            scripts.codex_package.test_zsh \
            -v

      - name: Set up exact upstream Rust
        env:
          RUST_VERSION: ${{ steps.release.outputs.rust }}
          TARGET: ${{ steps.policy.outputs.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"

      - name: Check Cargo workspace metadata
        working-directory: ${{ runner.temp }}/source/codex-rs
        run: |
          cargo metadata \
            --locked \
            --format-version 1 \
            --filter-platform "${{ steps.policy.outputs.target }}" \
            >/dev/null

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1
          bazelisk-cache: true
          repository-cache: true
          module-root: ${{ runner.temp }}/source

      - name: Check the RISC-V V8 release target
        working-directory: ${{ runner.temp }}/source
        run: |
          bazel query \
            //third_party/v8:rusty_v8_sandbox_release_pair_riscv64gc_unknown_linux_musl

      - name: Upload immutable release lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-riscv64-release-lock
          path: ${{ runner.temp }}/release-lock.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  continue-chain:
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.continue_chain == true &&
      github.actor == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Trigger V8 build
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          gh workflow run v8-build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f compatibility_run_id="$GITHUB_RUN_ID" \
            -f compatibility_source_sha="$GITHUB_SHA" \
            -f continue_chain=true \
            -f task_id="$TASK_ID"
