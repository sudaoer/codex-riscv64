name: Upstream stable watcher

on:
  schedule:
    - cron: "23 19 * * *" # 03:23 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: upstream-stable-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out downstream inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Resolve latest stable release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py resolve-latest \
            --output "${RUNNER_TEMP}/release-lock.json"

      - name: Check downstream release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger compatibility and build chain
        if: steps.state.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run compat-check.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
