name: Upstream stable watcher

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      retry_version:
        description: Stable upstream version to retry (X.Y.Z)
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-stable-watcher
  cancel-in-progress: false

jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out downstream inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Reconcile and dispatch stable release tasks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RETRY_VERSION: ${{ inputs.retry_version }}
        run: |
          python3 scripts/upstream_watch.py --retry-version "$RETRY_VERSION"
