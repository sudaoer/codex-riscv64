name: Upstream stable watcher

on:
  schedule:
    - cron: "23 19 * * *" # 03:23 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-stable-watcher
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Mint updater GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.UPDATER_APP_ID }}
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out downstream inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Update the stable manifest
        id: upstream
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/release.py update-upstream

      - name: Commit fixed update branch
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          branch=automation/upstream-stable
          gh auth setup-git
          git config user.name codex-riscv64-updater[bot]
          git config user.email codex-riscv64-updater[bot]@users.noreply.github.com
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git checkout -B "$branch"
          git add release/upstream.toml
          git commit -m "chore: follow Codex ${VERSION}"
          git push --force-with-lease origin "HEAD:${branch}"

      - name: Create or refresh update pull request
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          TAG: ${{ steps.upstream.outputs.tag }}
          COMMIT_SHA: ${{ steps.upstream.outputs.commit_sha }}
        run: |
          branch=automation/upstream-stable
          title="chore: follow Codex ${VERSION}"
          body="Automated stable update to \`${TAG}\` (\`${COMMIT_SHA}\`).

          Compatibility checks reconstruct the exact tag and apply the ordered patch series."
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          fi
