name: Upstream stable watcher

on:
  schedule:
    - cron: "23 19 * * *" # 03:23 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: upstream-stable-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out downstream inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve latest stable release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py resolve-latest \
            --output "${RUNNER_TEMP}/release-lock.json"

      - name: Check downstream release state
        id: state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py \
            --release-lock "${RUNNER_TEMP}/release-lock.json" \
            release-state

      - name: Trigger compatibility and build chain
        if: steps.state.outputs.hit == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run compat-check.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f continue_chain=true
