name: V8 build

on:
  workflow_run:
    workflows: ["Compatibility check"]
    types: [completed]
  workflow_dispatch:
    inputs:
      compatibility_run_id:
        description: Successful Compatibility check run ID for an automated chain
        required: false
        type: string
      compatibility_source_sha:
        description: Exact source revision checked by the Compatibility check run
        required: false
        type: string
      continue_chain:
        description: Internal flag used by the upstream watcher to continue the build chain
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: v8-${{ inputs.compatibility_source_sha || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.actor.login != 'github-actions[bot]' &&
       contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Resolve V8 source revision
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          COMPATIBILITY_RUN_ID: ${{ inputs.compatibility_run_id }}
          COMPATIBILITY_SOURCE_SHA: ${{ inputs.compatibility_source_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          event_name = os.environ["EVENT_NAME"]
          workflow_run_id = os.environ["WORKFLOW_RUN_ID"].strip()
          workflow_run_sha = os.environ["WORKFLOW_RUN_SHA"].strip()
          compatibility_run_id = os.environ["COMPATIBILITY_RUN_ID"].strip()
          compatibility_source_sha = os.environ["COMPATIBILITY_SOURCE_SHA"].strip()

          if event_name == "workflow_run":
              source_sha = workflow_run_sha
              release_run_id = workflow_run_id
          elif compatibility_run_id or compatibility_source_sha:
              if not compatibility_run_id or not compatibility_source_sha:
                  raise SystemExit(
                      "compatibility_run_id and compatibility_source_sha must be provided together"
                  )
              if not compatibility_run_id.isdecimal() or int(compatibility_run_id) <= 0:
                  raise SystemExit("invalid Compatibility check run ID")
              if re.fullmatch(r"[0-9a-f]{40}", compatibility_source_sha) is None:
                  raise SystemExit("invalid Compatibility check source SHA")

              deadline = time.monotonic() + 120
              while True:
                  response = subprocess.run(
                      [
                          "gh",
                          "api",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                          f"{compatibility_run_id}",
                      ],
                      check=True,
                      stdout=subprocess.PIPE,
                      text=True,
                  )
                  run = json.loads(response.stdout)
                  expected = {
                      "path": ".github/workflows/compat-check.yml",
                      "event": "workflow_dispatch",
                      "head_branch": "main",
                      "head_sha": compatibility_source_sha,
                  }
                  for key, value in expected.items():
                      if run.get(key) != value:
                          raise SystemExit(
                              f"Compatibility check run {key} mismatch: "
                              f"expected {value!r}, got {run.get(key)!r}"
                          )
                  if (run.get("head_repository") or {}).get("full_name") != os.environ[
                      "GITHUB_REPOSITORY"
                  ]:
                      raise SystemExit("Compatibility check repository mismatch")
                  if (run.get("actor") or {}).get("login") != "github-actions[bot]":
                      raise SystemExit("Compatibility check was not dispatched by the watcher")
                  if run.get("status") == "completed":
                      if run.get("conclusion") != "success":
                          raise SystemExit("Compatibility check did not succeed")
                      break
                  if time.monotonic() >= deadline:
                      raise SystemExit("timed out waiting for Compatibility check completion")
                  time.sleep(2)

              source_sha = compatibility_source_sha
              release_run_id = compatibility_run_id
          else:
              source_sha = os.environ["DISPATCH_SHA"]
              release_run_id = ""

          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("invalid V8 source SHA")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"sha={source_sha}\n")
              output.write(f"release_run_id={release_run_id}\n")
          PY

      - name: Download immutable release lock
        if: steps.source.outputs.release_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-riscv64-release-lock
          path: ${{ runner.temp }}/release
          run-id: ${{ steps.source.outputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Check out exact downstream inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve manual release lock
        if: steps.source.outputs.release_run_id == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/release"
          python3 scripts/release.py resolve-latest \
            --output "${RUNNER_TEMP}/release/release-lock.json"

      - name: Resolve pinned release policy
        id: policy
        run: |
          python3 scripts/release.py \
            --release-lock "${RUNNER_TEMP}/release/release-lock.json" \
            validate

      - name: Reconstruct exact patched source
        run: |
          python3 scripts/release.py \
            --release-lock "${RUNNER_TEMP}/release/release-lock.json" \
            prepare \
            --source-dir "${RUNNER_TEMP}/source" \
            --report "${RUNNER_TEMP}/source-info.json"

      - name: Resolve immutable V8 identity
        id: v8
        run: |
          python3 scripts/release.py \
            --release-lock "${RUNNER_TEMP}/release/release-lock.json" \
            v8-key --source-dir "${RUNNER_TEMP}/source"

      - name: Resolve immutable V8 release
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
          V8_TAG: ${{ steps.v8.outputs.v8_release_tag }}
        run: |
          mkdir -p "${RUNNER_TEMP}/v8"
          if gh release view "$V8_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            state="$(gh release view "$V8_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft, .isPrerelease] | @tsv')"
            if [[ "$state" != $'false\ttrue' ]]; then
              echo "Existing V8 release must be a published prerelease" >&2
              exit 1
            fi
            gh release download "$V8_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "${RUNNER_TEMP}/v8"
            python3 scripts/release.py \
              --release-lock "${RUNNER_TEMP}/release/release-lock.json" \
              validate-v8 \
              --source-dir "${RUNNER_TEMP}/source" \
              --v8-dir "${RUNNER_TEMP}/v8" >/dev/null
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bazel
        if: steps.cache.outputs.hit == 'false'
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: ${{ steps.v8.outputs.bazelisk }}
          bazelisk-cache: true
          repository-cache: true
          module-root: ${{ runner.temp }}/source

      - name: Install V8 build prerequisites
        if: steps.cache.outputs.hit == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils llvm pkg-config libcap-dev zstd

      - name: Build and seal V8
        if: steps.cache.outputs.hit == 'false'
        env:
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
        run: |
          bash scripts/build_v8.sh \
            --source-dir "${RUNNER_TEMP}/source" \
            --v8-dir "${RUNNER_TEMP}/v8" \
            --release-lock "${RUNNER_TEMP}/release/release-lock.json"

      - name: Verify resolved V8 bytes
        run: |
          python3 scripts/release.py \
            --release-lock "${RUNNER_TEMP}/release/release-lock.json" \
            validate-v8 \
            --source-dir "${RUNNER_TEMP}/source" \
            --v8-dir "${RUNNER_TEMP}/v8" >/dev/null

      - name: Generate V8 build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/v8/*

      - name: Publish immutable V8 release
        if: steps.cache.outputs.hit == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V8_TAG: ${{ steps.v8.outputs.v8_release_tag }}
          V8_INPUT_SHA256: ${{ steps.v8.outputs.v8_input_sha256 }}
          V8_VERSION: ${{ steps.v8.outputs.rusty_v8 }}
          V8_HEAD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh release create "$V8_TAG" "${RUNNER_TEMP}"/v8/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$V8_HEAD_SHA" \
            --title "rusty_v8 ${V8_VERSION} for Linux/riscv64" \
            --notes "Immutable V8 input SHA-256: ${V8_INPUT_SHA256}" \
            --prerelease \
            --latest=false

      - name: Verify V8 attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          builder_sha="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["builder"]["head_sha"])' \
            "${RUNNER_TEMP}/v8/v8-build.json")"
          for path in "${RUNNER_TEMP}"/v8/*; do
            gh attestation verify "$path" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/v8-build.yml" \
              --source-ref refs/heads/main \
              --source-digest "$builder_sha" >/dev/null
          done

      - name: Seal Candidate handoff
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          V8_TAG: ${{ steps.v8.outputs.v8_release_tag }}
          V8_INPUT_SHA256: ${{ steps.v8.outputs.v8_input_sha256 }}
          RELEASE_LOCK_SHA256: ${{ steps.policy.outputs.release_lock_sha256 }}
        run: |
          mkdir -p handoff
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          handoff = {
              "schema_version": 1,
              "v8_run_id": os.environ["GITHUB_RUN_ID"],
              "source_sha": os.environ["SOURCE_SHA"],
              "release_lock_sha256": os.environ["RELEASE_LOCK_SHA256"],
              "v8_release_tag": os.environ["V8_TAG"],
              "v8_input_sha256": os.environ["V8_INPUT_SHA256"],
          }
          Path("handoff/v8-handoff.json").write_text(
              json.dumps(handoff, indent=2, sort_keys=True) + "\n"
          )
          Path("handoff/release-lock.json").write_bytes(
              Path(os.environ["RUNNER_TEMP"], "release", "release-lock.json").read_bytes()
          )
          PY

      - name: Upload Candidate handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-riscv64-v8-handoff
          path: |
            handoff/v8-handoff.json
            handoff/release-lock.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  continue-chain:
    needs: build
    if: >-
      needs.build.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.continue_chain == true &&
      github.actor == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Trigger Candidate build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run candidate-build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f v8_run_id="$GITHUB_RUN_ID"
