name: Candidate build

on:
  workflow_run:
    workflows: ["V8 build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Force a rebuild but do not overwrite an existing formal release
        required: false
        default: false
        type: boolean
      v8_run_id:
        description: Successful V8 build run ID for an automated chain
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-${{ inputs.v8_run_id || github.event.workflow_run.id || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.actor.login != 'github-actions[bot]' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      build_required: ${{ steps.decide.outputs.build_required }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Validate chained V8 run
        if: github.event_name == 'workflow_dispatch' && inputs.v8_run_id != ''
        env:
          V8_RUN_ID: ${{ inputs.v8_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          run_id = os.environ["V8_RUN_ID"].strip()
          if not run_id.isdecimal() or int(run_id) <= 0:
              raise SystemExit("invalid V8 build run ID")

          deadline = time.monotonic() + 120
          while True:
              response = subprocess.run(
                  [
                      "gh",
                      "api",
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
                  text=True,
              )
              run = json.loads(response.stdout)
              expected = {
                  "path": ".github/workflows/v8-build.yml",
                  "event": "workflow_dispatch",
                  "head_branch": "main",
              }
              for key, value in expected.items():
                  if run.get(key) != value:
                      raise SystemExit(
                          f"V8 build run {key} mismatch: "
                          f"expected {value!r}, got {run.get(key)!r}"
                      )
              if (run.get("head_repository") or {}).get("full_name") != os.environ[
                  "GITHUB_REPOSITORY"
              ]:
                  raise SystemExit("V8 build repository mismatch")
              if (run.get("actor") or {}).get("login") != "github-actions[bot]":
                  raise SystemExit("V8 build was not dispatched by the automated chain")
              if run.get("status") == "completed":
                  if run.get("conclusion") != "success":
                      raise SystemExit("V8 build did not succeed")
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit("timed out waiting for V8 build completion")
              time.sleep(2)
          PY

      - name: Download V8 handoff
        if: >-
          github.event_name == 'workflow_run' ||
          (github.event_name == 'workflow_dispatch' && inputs.v8_run_id != '')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-riscv64-v8-handoff
          path: ${{ runner.temp }}/handoff
          run-id: ${{ github.event.workflow_run.id || inputs.v8_run_id }}
          github-token: ${{ github.token }}

      - name: Resolve candidate source revision
        id: source
        env:
          HANDOFF_RUN_ID: ${{ github.event.workflow_run.id || inputs.v8_run_id }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          handoff_run_id = os.environ["HANDOFF_RUN_ID"].strip()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              if not handoff_run_id:
                  output.write(f"sha={os.environ['DISPATCH_SHA']}\n")
                  raise SystemExit(0)

              handoff = json.loads(
                  Path(
                      os.environ["RUNNER_TEMP"], "handoff", "v8-handoff.json"
                  ).read_text()
              )
              expected_keys = {
                  "schema_version",
                  "v8_run_id",
                  "source_sha",
                  "release_lock_sha256",
                  "v8_release_tag",
                  "v8_input_sha256",
              }
              if set(handoff) != expected_keys or handoff["schema_version"] != 1:
                  raise SystemExit("invalid V8 handoff schema")
              if str(handoff["v8_run_id"]) != handoff_run_id:
                  raise SystemExit("V8 handoff run ID mismatch")
              if re.fullmatch(r"[0-9a-f]{40}", str(handoff["source_sha"])) is None:
                  raise SystemExit("invalid V8 handoff source SHA")
              if re.fullmatch(
                  r"[0-9a-f]{64}", str(handoff["release_lock_sha256"])
              ) is None:
                  raise SystemExit("invalid release lock SHA")
              if re.fullmatch(
                  r"[0-9a-f]{64}", str(handoff["v8_input_sha256"])
              ) is None:
                  raise SystemExit("invalid V8 handoff input SHA")
              if re.fullmatch(
                  r"rusty-v8-riscv64-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{12}",
                  str(handoff["v8_release_tag"]),
              ) is None:
                  raise SystemExit("invalid V8 handoff release tag")
              output.write(f"sha={handoff['source_sha']}\n")
              output.write(
                  f"release_lock_sha256={handoff['release_lock_sha256']}\n"
              )
              output.write(f"v8_release_tag={handoff['v8_release_tag']}\n")
              output.write(f"v8_input_sha256={handoff['v8_input_sha256']}\n")
          PY

      - name: Check out exact downstream inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve manual release lock
        if: github.event_name == 'workflow_dispatch' && inputs.v8_run_id == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/handoff"
          python3 scripts/release.py resolve-latest \
            --output "${RUNNER_TEMP}/handoff/release-lock.json"

      - name: Resolve pinned release policy
        id: policy
        run: |
          python3 scripts/release.py \
            --release-lock "${RUNNER_TEMP}/handoff/release-lock.json" \
            validate

      - name: Verify release lock handoff
        env:
          HANDOFF_LOCK_SHA256: ${{ steps.source.outputs.release_lock_sha256 }}
          RESOLVED_LOCK_SHA256: ${{ steps.policy.outputs.release_lock_sha256 }}
        run: |
          if [[ -n "$HANDOFF_LOCK_SHA256" && \
                "$HANDOFF_LOCK_SHA256" != "$RESOLVED_LOCK_SHA256" ]]; then
            echo "V8 handoff release lock digest does not match release lock" >&2
            exit 1
          fi

      - name: Check for an existing formal release
        id: release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py \
            --release-lock "${RUNNER_TEMP}/handoff/release-lock.json" \
            release-state

      - name: Decide whether a new build is required
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true }}
          RELEASE_HIT: ${{ steps.release.outputs.hit || 'false' }}
        run: |
          python3 scripts/release.py decide-build \
            --event-name "$EVENT_NAME" \
            --force-rebuild "${FORCE_REBUILD,,}" \
            --release-hit "$RELEASE_HIT"

      - name: Record reused formal release
        if: steps.decide.outputs.build_required == 'false'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          {
            echo "## Reused formal release"
            echo
            echo "Release \`${RELEASE_TAG}\` is already a complete formal release: ${RELEASE_URL}"
            echo
            echo "No new Candidate was generated. Build, attestation, and artifact upload steps were skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconstruct exact patched source
        if: steps.decide.outputs.build_required == 'true'
        run: |
          python3 scripts/release.py \
            --release-lock "${RUNNER_TEMP}/handoff/release-lock.json" \
            prepare \
            --source-dir "${RUNNER_TEMP}/source" \
            --report "${RUNNER_TEMP}/source-info.json"

      - name: Resolve immutable V8 identity
        id: v8
        if: steps.decide.outputs.build_required == 'true'
        run: |
          python3 scripts/release.py \
            --release-lock "${RUNNER_TEMP}/handoff/release-lock.json" \
            v8-key --source-dir "${RUNNER_TEMP}/source"

      - name: Download and verify immutable V8 release
        if: steps.decide.outputs.build_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V8_TAG: ${{ steps.v8.outputs.v8_release_tag }}
          V8_INPUT_SHA256: ${{ steps.v8.outputs.v8_input_sha256 }}
          HANDOFF_TAG: ${{ steps.source.outputs.v8_release_tag }}
          HANDOFF_INPUT_SHA256: ${{ steps.source.outputs.v8_input_sha256 }}
        run: |
          if [[ -n "$HANDOFF_TAG" && "$HANDOFF_TAG" != "$V8_TAG" ]]; then
            echo "V8 handoff release tag does not match reconstructed source" >&2
            exit 1
          fi
          if [[ -n "$HANDOFF_INPUT_SHA256" && "$HANDOFF_INPUT_SHA256" != "$V8_INPUT_SHA256" ]]; then
            echo "V8 handoff input digest does not match reconstructed source" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/v8"
          gh release download "$V8_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "${RUNNER_TEMP}/v8"
          python3 scripts/release.py \
            --release-lock "${RUNNER_TEMP}/handoff/release-lock.json" \
            validate-v8 \
            --source-dir "${RUNNER_TEMP}/source" \
            --v8-dir "${RUNNER_TEMP}/v8" >/dev/null
          builder_sha="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["builder"]["head_sha"])' \
            "${RUNNER_TEMP}/v8/v8-build.json")"
          for path in "${RUNNER_TEMP}"/v8/*; do
            gh attestation verify "$path" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/v8-build.yml" \
              --source-ref refs/heads/main \
              --source-digest "$builder_sha" >/dev/null
          done

      - name: Set up exact upstream Rust
        if: steps.decide.outputs.build_required == 'true'
        env:
          RUST_VERSION: ${{ steps.policy.outputs.rust }}
          TARGET: ${{ steps.policy.outputs.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"

      - name: Use a hermetic Cargo home
        if: steps.decide.outputs.build_required == 'true'
        run: |
          cargo_home="${RUNNER_TEMP}/cargo-home"
          mkdir -p "$cargo_home/bin"
          : >"$cargo_home/config.toml"
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
          echo "$cargo_home/bin" >> "$GITHUB_PATH"

      - name: Check target Cargo lockfile
        if: steps.decide.outputs.build_required == 'true'
        working-directory: ${{ runner.temp }}/source/codex-rs
        run: |
          cargo metadata \
            --locked \
            --format-version 1 \
            --filter-platform "${{ steps.policy.outputs.target }}" \
            >/dev/null

      - name: Set up Zig
        if: steps.decide.outputs.build_required == 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.policy.outputs.zig }}
          use-cache: false

      - name: Install packaging prerequisites
        if: steps.decide.outputs.build_required == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils llvm pkg-config libcap-dev zstd

      - name: Install upstream musl build tools
        if: steps.decide.outputs.build_required == 'true'
        env:
          TARGET: riscv64gc-unknown-linux-musl
        run: bash "${RUNNER_TEMP}/source/.github/scripts/install-musl-build-tools.sh"

      - name: Build and seal candidate
        if: steps.decide.outputs.build_required == 'true'
        env:
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
        run: |
          bash scripts/build_candidate.sh \
            --source-dir "${RUNNER_TEMP}/source" \
            --v8-dir "${RUNNER_TEMP}/v8" \
            --source-info "${RUNNER_TEMP}/source-info.json" \
            --release-lock "${RUNNER_TEMP}/handoff/release-lock.json" \
            --candidate-dir "${GITHUB_WORKSPACE}/candidate"

      - name: Generate build provenance attestation
        if: steps.decide.outputs.build_required == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: candidate/*

      - name: Upload immutable candidate
        if: steps.decide.outputs.build_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-riscv64-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  continue-chain:
    needs: build
    if: >-
      needs.build.result == 'success' &&
      needs.build.outputs.build_required == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch QEMU validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run qemu-validate.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
          -f candidate_run_id="$GITHUB_RUN_ID"
