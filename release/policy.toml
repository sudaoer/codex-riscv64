schema_version = 1

[distribution]
repository = "sudaoer/codex-riscv64"
channel = "stable"
revision = 1
target = "riscv64gc-unknown-linux-musl"
candidate_retention_days = 14
k3_report_max_age_days = 7

[upstream]
repository = "openai/codex"

[toolchain]
zig = "0.14.0"

[policy]
cpu_baseline = "rv64gc"
allow_rvv = false
release_profile = "release"
v8_profile = "ptrcomp_sandbox_release"
